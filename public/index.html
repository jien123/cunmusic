<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CunMusic · 我的音乐</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">🎵 CunMusic</div>
    <button id="refreshBtn" class="refresh-btn">🔄 同步</button>
  </header>

  <main class="main">
    <section class="song-list" id="songList">
      <div class="welcome">
        <div class="welcome-icon">🎧</div>
        <p>加载中…</p>
      </div>
    </section>
  </main>

  <footer class="player">
    <div class="song-info">
      <div class="cover-ph">🎵</div>
      <div>
        <div class="song-name" id="songName">未在播放</div>
        <div class="singer" id="singer">—</div>
      </div>
    </div>
    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playBtn" class="play">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
    <div class="progress-wrap">
      <span id="curTime">0:00</span>
      <input type="range" id="progress" value="0" max="100">
      <span id="duration">0:00</span>
    </div>
    <div class="volume">
      <span>🔊</span>
      <input type="range" id="volume" value="80" max="100">
    </div>
    <audio id="audio" preload="none"></audio>
  </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
